services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: arya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arya}
      # M1 (release hardening): no silent default — startup fails fast with
      # a clear error if POSTGRES_PASSWORD is unset/empty.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (generate a strong value; see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-arya_os}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - arya_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arya}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: arya-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - arya_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Phase 22: run the validated, digest-reproducible image instead of an
    # implicit build + host bind mount (see Phases 19-21). Rebuilds are now
    # an explicit decision: docker build -f docker/Dockerfile.backend \
    #   -t arya-os-backend:phase20-pinned .
    image: arya-os-backend:phase20-pinned
    container_name: arya-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # M1 (release hardening): the API key must be provided explicitly —
      # docker compose fails at configuration time if unset/empty, instead
      # of letting the app start with a placeholder credential.
      ARYA_API_KEY: ${ARYA_API_KEY:?ARYA_API_KEY must be set (generate a strong value; see .env.example)}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - arya_storage_data:/app/data/storage

  n8n:
    image: n8nio/n8n:2.30.8@sha256:11524034450080bd0032754892b23ff20be43d72cf320ce75640f7c5475fdca8
    container_name: arya-n8n
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-arya_os}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-arya}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (generate a strong value; see .env.example)}
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "-T", "5", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - arya_n8n_data:/home/node/.n8n

volumes:
  arya_postgres_data:
  arya_redis_data:
  arya_storage_data:
  arya_n8n_data:
