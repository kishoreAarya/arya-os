[project]
name = "arya-os"
version = "0.1.0"
description = "Project Arya OS - Personal AI Content Factory (Sprint 1: Foundation)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.18.5",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "apscheduler>=3.10.4",
    "httpx>=0.28.1",
    "google-auth>=2.36.0",
    "google-api-python-client>=2.149.0",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
storage-s3 = [
    "boto3>=1.35.0",  # only needed when STORAGE_BACKEND=s3 or r2
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
