version: "3.9"

# ==============================================================================
# Project Arya OS — Hardened Production Docker Compose
# Self-hosted single-operator deployment configuration.
# PostgreSQL and Redis ports are NOT exposed to the host/internet.
# Persistent volumes mounted for PostgreSQL, Redis, and media storage artifacts.
# ==============================================================================

networks:
  arya-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: arya-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arya}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?ERROR: POSTGRES_PASSWORD must be set in production}"
      POSTGRES_DB: ${POSTGRES_DB:-arya_os}
    # Database is strictly internal to arya-net; NOT published to public internet
    networks:
      - arya-net
    volumes:
      - arya_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arya} -d ${POSTGRES_DB:-arya_os}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: arya-redis-prod
    restart: unless-stopped
    # Redis is strictly internal to arya-net; NOT published to public internet
    networks:
      - arya-net
    volumes:
      - arya_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: arya-backend-prod
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
      UVICORN_WORKERS: "1"
      UVICORN_TIMEOUT_KEEP_ALIVE: "65"
      UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN: "60"
      AUTO_RUN_MIGRATIONS: "true"
      API_AUTH_ENABLED: "true"
      ARYA_API_KEY: "${ARYA_API_KEY:?ERROR: ARYA_API_KEY must be set in production}"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-arya}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arya_os}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_PATH: /app/data/storage
      APP_NAME: ${APP_NAME:-arya-os}
      # --- Scheduler / feature flags ---
      ENABLE_BACKGROUND_SCHEDULER: ${ENABLE_BACKGROUND_SCHEDULER:-true}
      ENABLE_LEARNING_LOOP: ${ENABLE_LEARNING_LOOP:-true}
      ENABLE_AUTONOMOUS_PUBLISHING: ${ENABLE_AUTONOMOUS_PUBLISHING:-false}
      ENABLE_EXPERIMENTAL_THUMBNAIL_AGENT: ${ENABLE_EXPERIMENTAL_THUMBNAIL_AGENT:-false}
      ENABLE_NEW_IMAGE_MODEL: ${ENABLE_NEW_IMAGE_MODEL:-false}
      ENABLE_NEW_VALIDATOR: ${ENABLE_NEW_VALIDATOR:-false}
      # --- Storage (optional object storage) ---
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      # --- LLM providers (optional; empty = not configured) ---
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-deepseek/deepseek-chat}
      # --- Media providers (optional) ---
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      FAL_API_KEY: ${FAL_API_KEY:-}
      REPLICATE_API_KEY: ${REPLICATE_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-JBFqnCBsd6RMkjVDRZzb}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_turbo_v2_5}
      DEFAULT_VOICE_PROVIDER: ${DEFAULT_VOICE_PROVIDER:-elevenlabs}
      DEFAULT_VIDEO_PROVIDER: ${DEFAULT_VIDEO_PROVIDER:-kling}
      # --- Tunables ---
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-60}
      MAX_RETRY_ATTEMPTS: ${MAX_RETRY_ATTEMPTS:-3}
      MAX_COST_PER_VIDEO_USD: ${MAX_COST_PER_VIDEO_USD:-5.00}
      QUALITY_THRESHOLD: ${QUALITY_THRESHOLD:-70.0}
      IMAGE_RESOLUTION: ${IMAGE_RESOLUTION:-1024x1024}
      VIDEO_FPS: ${VIDEO_FPS:-30}
      # --- Publishing integrations (optional) ---
      POSTIZ_BASE_URL: ${POSTIZ_BASE_URL:-http://localhost:4007}
      POSTIZ_API_KEY: ${POSTIZ_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID:-}
    # Phase 31: least-privilege environment (Phase 30 audit) — env_file
    # removed so the backend no longer receives the entire .env.
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    networks:
      - arya-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Persistent storage volume ensures videos/thumbnails survive container rebuilds
      - arya_storage_data:/app/data/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  arya_postgres_data:
    name: arya_postgres_data
  arya_redis_data:
    name: arya_redis_data
  arya_storage_data:
    name: arya_storage_data
