name: Test

# Sprint 1-3 scope: unit/smoke tests only against the backend
# foundation (health checks, models, services). Agents and validators
# are stubs (NotImplementedError / placeholder passes) so there is no
# generation-pipeline behavior to test yet — do not add integration or
# end-to-end suites here until Sprint 3+ wires in real provider calls.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: checkout (incl. public Hermes submodule) is the only
# GITHUB_TOKEN consumer; upload-artifact uses the Actions runtime token.
permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Pytest + Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arya
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: arya_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DEBUG: "false"
      LOG_LEVEL: WARNING
      DATABASE_URL: postgresql+asyncpg://arya:test_password@localhost:5432/arya_os_test
      # L-7: authenticated Redis URL. The embedded password is a synthetic,
      # non-secret test credential (same posture as POSTGRES_PASSWORD above)
      # and is the single source of truth for the Redis started below.
      REDIS_URL: redis://:arya-ci-synthetic-redis-password@localhost:6379/0
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: ./data/storage

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Hermes source (vendor/hermes-agent) is part of the test
          # environment: checkout fails closed if the pinned submodule
          # SHA cannot be fetched.
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Verify Hermes source and generate source record
        # Verifies the submodule's commit and tree SHAs against the
        # approved pins, then emits backend/app/hermes/source_record.json.
        # Any mismatch or missing source fails this job (spec §2/§14.1).
        run: uv run python -m app.hermes.source

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U arya; do
            echo "waiting for postgres..."; sleep 2;
          done
        env:
          PGPASSWORD: test_password

      - name: Start authenticated Redis
        # L-7: the test Redis REQUIRES authentication (GitHub Actions
        # service containers cannot append a server command, so Redis runs
        # via docker run). The password is extracted from REDIS_URL — the
        # same synthetic credential embedded above — so server and client
        # can never drift. It is passed to the container as an environment
        # variable (not on the healthcheck command line) and never echoed.
        run: |
          password="$(printf '%s' "$REDIS_URL" | sed -E 's#^redis://:([^@]+)@.*/#\1#')"
          if [ -z "$password" ] || [ "$password" = "$REDIS_URL" ]; then
            echo "REDIS_URL does not carry an embedded password"; exit 1;
          fi
          # R4/Phase 50C: immutable multi-architecture OCI index digest
          # (linux/amd64 + linux/arm64/v8 verified via registry metadata),
          # aligned with the dev/prod Compose pin. Manually maintained:
          # Dependabot's docker ecosystem covers /docker (Dockerfile) only,
          # so tag movement is NOT tracked here — update deliberately,
          # together with docker-compose*.yml.
          docker run -d --name arya-test-redis \
            -p 6379:6379 \
            -e REDIS_PASSWORD="$password" \
            --health-cmd 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG' \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 10 \
            redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99 --requirepass "$password"

      - name: Wait for Redis
        run: |
          password="$(printf '%s' "$REDIS_URL" | sed -E 's#^redis://:([^@]+)@.*/#\1#')"
          until docker exec arya-test-redis redis-cli --no-auth-warning -a "$password" ping 2>/dev/null | grep -q PONG; do
            echo "waiting for redis..."; sleep 2;
          done

      - name: Apply migrations
        # No migration files exist in alembic/versions/ yet (see
        # engineering review — this is a known pre-launch gap, not a
        # CI bug). This step is a no-op today and becomes real the
        # moment the first migration is committed; it deliberately
        # does not fail the build in the meantime.
        run: |
          if [ -n "$(ls -A alembic/versions 2>/dev/null | grep -v .gitkeep)" ]; then
            uv run alembic upgrade head
          else
            echo "No migrations found under alembic/versions/ yet — skipping."
          fi

      - name: Install ffmpeg (test dependency)
        # Cause-4: the image-motion, sound-resolver, task16 and task19
        # suites exercise the real ffmpeg/ffprobe binaries, which
        # ubuntu-latest runners do not ship. Install from Ubuntu's own
        # archive via apt (the runner's supported package manager) — no
        # third-party actions, binary downloads, or credentials. Both
        # binaries are verified below and the step fails closed if
        # either is unavailable before pytest runs.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Run pytest with coverage
        run: |
          uv run pytest \
            --cov=backend/app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=0

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
