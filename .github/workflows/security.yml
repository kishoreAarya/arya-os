name: Security

# Static analysis + dependency vulnerability scanning only. No secret
# scanning against live infra, no DAST, no penetration testing — those
# only make sense once real endpoints/auth exist beyond today's stub
# agents/validators and unauthenticated scaffold routers.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new CVEs against pinned deps surface even without a
    # code change opening a PR.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege: checkout is the only GITHUB_TOKEN consumer. No SARIF
# upload exists, so security-events: write is not needed.
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit (static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Hermes source (vendor/hermes-agent) is required by
          # `uv sync --extra dev` (editable dependency): checkout fails
          # closed if the pinned submodule SHA cannot be fetched.
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Run Bandit
        # Config (severity, excluded dirs) lives in pyproject.toml
        # under [tool.bandit] — kept in one place instead of duplicated
        # as CLI flags here.
        run: uv run bandit -c pyproject.toml -r backend/app -f screen

  pip-audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Hermes source (vendor/hermes-agent) is required by
          # `uv sync --extra dev` (editable dependency): checkout fails
          # closed if the pinned submodule SHA cannot be fetched.
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Export locked third-party dependencies
        # `uv sync --extra dev` installs arya-os itself as an editable local
        # package (and the vendored Hermes agent as an editable path
        # dependency); environment-mode `pip-audit --strict` treats the
        # unauditable local project as fatal. `pip-audit --locked` does not
        # recognize uv.lock (and exits 0 without auditing anything). The
        # strict gate therefore audits the LOCKED third-party graph itself:
        # `--frozen` derives the export from uv.lock without re-resolution,
        # `--no-emit-project`/`--no-emit-local` exclude the local projects
        # while keeping every third-party pin (including Hermes' transitive
        # dependencies), and the hashes satisfy `--disable-pip`'s pinned-set
        # requirement so the audit runs directly on the locked versions.
        run: >
          uv export --format requirements-txt --extra dev --frozen
          --no-emit-project --no-emit-local -o requirements-audit.txt

      - name: Run pip-audit
        run: uv run pip-audit -r requirements-audit.txt --strict --disable-pip
