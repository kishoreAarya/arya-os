name: Docker

# Build + basic validation only. No push to a registry, no deployment
# — deployment.yml deliberately does not exist yet (no target
# environment is defined). This just proves the image still builds
# and the Dockerfile itself follows basic best practice.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    name: Validate Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: docker/Dockerfile.backend
          # DL3008/DL3013 (unpinned apt/pip versions) and DL3002
          # (root user) are known, tracked gaps from the engineering
          # review — not silently ignored, just not yet blocking while
          # the image is still Sprint 1-3 scaffold. Tighten this list
          # down as each item is fixed.
          failure-threshold: error

  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: hadolint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          tags: arya-os-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        # Confirms the container actually starts and the process is
        # alive — does not hit /health, since that needs live
        # Postgres/Redis (covered by test.yml, not here).
        run: |
          docker run -d --name arya-backend-ci -p 8000:8000 arya-os-backend:ci
          sleep 5
          docker ps --filter "name=arya-backend-ci" --filter "status=running" | grep arya-backend-ci
          docker logs arya-backend-ci
          docker stop arya-backend-ci
