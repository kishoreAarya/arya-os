version: 2

updates:
  # Python dependencies (pyproject.toml / uv)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Dev-only tooling bumps (ruff/black/bandit/pip-audit/pytest) get
      # grouped into one PR instead of five separate ones.
      dev-tooling:
        patterns:
          - "ruff"
          - "black"
          - "bandit"
          - "pip-audit"
          - "pytest*"

  # GitHub Actions versions used in .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"

  # Base images referenced by docker/Dockerfile.backend and
  # docker-compose.yml (python, postgres, redis, n8n).
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
